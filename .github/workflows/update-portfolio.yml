name: Update Portfolio

on:
  schedule:
    - cron: '0 3 * * *'   # Roda todo dia às 3h da manhã
  push:
    branches: [main]       # Também roda a cada push
  workflow_dispatch:       # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Generate portfolio
        run: python generate.py
        env:
          GITHUB_USER: emersonaparecidosilva

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "🤖 Portfólio atualizado automaticamente"
          git push
